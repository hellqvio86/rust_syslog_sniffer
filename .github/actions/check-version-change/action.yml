name: 'Check Version Change'
description: 'Checks if the version in Cargo.toml has a corresponding git release tag'
outputs:
  changed:
    description: 'Whether a new tag/release is needed'
    value: ${{ steps.check.outputs.changed }}
  version:
    description: 'The current Cargo.toml version number'
    value: ${{ steps.check.outputs.version }}
runs:
  using: 'composite'
  steps:
    - name: Check version change
      id: check
      shell: bash
      run: |
        CURRENT_VERSION=$(grep -m 1 '^version =' Cargo.toml | cut -d '"' -f 2)
        echo "Current Cargo.toml version: $CURRENT_VERSION"

        # Check if tag v$CURRENT_VERSION already exists on origin
        if git ls-remote --tags origin "refs/tags/v$CURRENT_VERSION" | grep -q "refs/tags/v$CURRENT_VERSION"; then
          echo "Tag v$CURRENT_VERSION already exists on origin; skipping release."
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "Tag v$CURRENT_VERSION does not exist on origin; new release will be created."
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
        echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
