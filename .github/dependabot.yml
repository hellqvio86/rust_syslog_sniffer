# Managed by Renovate for scheduled dependency updates.
# Dependabot open-pull-requests-limit is set to 0 to keep GitHub security alerts active
# without duplicate scheduled version upgrade PRs.
version: 2
updates:
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 0
