name: CI
permissions:
  contents: read

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [ published ]

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    name: Detect Version & Release Needs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      should_release: ${{ steps.detect.outputs.should_release }}
      should_publish_docker: ${{ steps.detect.outputs.should_publish_docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Detect version and release status
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
            echo "Release event for $TAG (version $VERSION)"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT

            if docker buildx imagetools inspect "docker.io/hellqvio/syslog_sniffer:${VERSION}" >/dev/null 2>&1; then
              echo "Docker image docker.io/hellqvio/syslog_sniffer:${VERSION} already exists on Docker Hub; skipping publish."
              echo "should_publish_docker=false" >> $GITHUB_OUTPUT
            else
              echo "Docker image docker.io/hellqvio/syslog_sniffer:${VERSION} does not exist on Docker Hub; will publish."
              echo "should_publish_docker=true" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.event_name }}" = "push" ] && ([ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]); then
            VERSION=$(grep -m 1 '^version =' Cargo.toml | cut -d '"' -f 2)
            TAG="v$VERSION"
            echo "Push event on ${{ github.ref }}. Cargo version: $VERSION ($TAG)"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT

            TAG_EXISTS=false
            if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
              TAG_EXISTS=true
            fi

            RELEASE_EXISTS=false
            if gh release view "$TAG" >/dev/null 2>&1; then
              RELEASE_EXISTS=true
            fi

            if [ "$TAG_EXISTS" = "true" ] && [ "$RELEASE_EXISTS" = "true" ]; then
              echo "Both tag and release $TAG exist. Skipping release."
              echo "should_release=false" >> $GITHUB_OUTPUT
            else
              echo "Release needed for $TAG (tag_exists=$TAG_EXISTS, release_exists=$RELEASE_EXISTS)."
              echo "should_release=true" >> $GITHUB_OUTPUT
            fi

            # Images are gated on publishing the draft release
            echo "should_publish_docker=false" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep -m 1 '^version =' Cargo.toml | cut -d '"' -f 2)
            echo "Non-release event (${{ github.event_name }} on ${{ github.ref }})."
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "should_publish_docker=false" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # v1 (stable)
      with:
        components: rustfmt, clippy

    - name: Cache Cargo registry and build
      uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpcap-dev netcat-openbsd make

    - name: Lint (fmt, clippy, doc)
      run: make lint

    - name: Run unit tests
      run: cargo test --locked

    - name: Run root/live capture tests
      run: sudo -E cargo test --locked -- --ignored

    - name: Security audit
      uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    name: Check MSRV (1.85)
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.85.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Check with MSRV
        run: cargo check --locked --all-targets

  docker-build-and-test:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build multi-arch image (test build for all platforms)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test all platforms under QEMU
        run: |
          for platform in linux/amd64 linux/arm64 linux/arm/v7; do
            echo "Smoke testing $platform..."
            tag="syslog_sniffer:${platform//\//_}"
            docker buildx build --platform "$platform" --load -t "$tag" .
            docker run --rm "$tag" --version
            docker run --rm -v "$(pwd)/tests/fixtures:/fixtures:ro" "$tag" --read-pcap /fixtures/valid_syslog.pcap
          done
          docker tag syslog_sniffer:linux_amd64 syslog_sniffer:latest

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd make

      - name: Run Docker E2E Test
        env:
          SKIP_DOCKER_BUILD: "1"
        run: |
          chmod +x tests/e2e_docker.sh
          ./tests/e2e_docker.sh

      - name: Run Docker Periodic E2E Test
        env:
          SKIP_DOCKER_BUILD: "1"
        run: |
          chmod +x tests/e2e_periodic_docker.sh
          ./tests/e2e_periodic_docker.sh

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev 

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # v1 (stable)

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@f87f9990b09867202953bff9aa0c80e23ee16bb7 # v2.49.18
        with:
          tool: cargo-tarpaulin

      - name: Generate coverage
        run: |
          cargo tarpaulin --locked --out Xml --fail-under 80 --follow-exec
          
          # Extract coverage percentage from cobertura.xml
          COVERAGE=$(python3 -c "import xml.etree.ElementTree as ET; print(f'{float(ET.parse(\"cobertura.xml\").getroot().attrib[\"line-rate\"]) * 100:.2f}')")
          echo "Coverage: $COVERAGE%"
          
          # Determine color based on threshold
          COLOR=$(python3 -c "cov = float('$COVERAGE'); print('green' if cov >= 80 else 'orange' if cov >= 50 else 'red')")
          
          # Download badge with retries and fail flag
          curl --fail --silent --show-error --retry 3 "https://img.shields.io/badge/coverage-$COVERAGE%25-$COLOR" -o coverage.svg

      - name: Upload coverage badge artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: coverage-badge
          path: coverage.svg

  update-coverage-badge:
    name: Update Coverage Badge
    needs: coverage
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Download coverage badge artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: coverage-badge

      - name: Commit coverage badge
        uses: stefanzweifel/git-auto-commit-action@8621497c8c39c72f3e2a999a26b4ca1b5058a842 # v5.0.1
        with:
          commit_message: "chore: update coverage badge"
          file_pattern: coverage.svg

  build-release-binaries:
    needs: [build-and-test, detect]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            gcc: ""
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            gcc: gcc-aarch64-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            arch: armhf
            gcc: gcc-arm-linux-gnueabihf

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies (Native)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Install system dependencies (Cross)
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          # 1. Restrict existing sources to amd64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
             # DEB822 format (Ubuntu 24.04+)
             sudo sed -i 's/Types: deb/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          fi
          
          if [ -f /etc/apt/sources.list ]; then
             # One-line format
             sudo sed -i 's/^deb/deb [arch=amd64]/' /etc/apt/sources.list
          fi
          
          # 2. Add ports source for target architecture
          echo "deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main universe multiverse restricted" | sudo tee /etc/apt/sources.list.d/ports.list
          echo "deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-updates main universe multiverse restricted" | sudo tee -a /etc/apt/sources.list.d/ports.list
          echo "deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-security main universe multiverse restricted" | sudo tee -a /etc/apt/sources.list.d/ports.list
          echo "deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-backports main universe multiverse restricted" | sudo tee -a /etc/apt/sources.list.d/ports.list
          
          sudo dpkg --add-architecture ${{ matrix.arch }}
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades libpcap-dev:${{ matrix.arch }} ${{ matrix.gcc }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # v1 (stable)
        with:
          targets: ${{ matrix.target }}

      - name: Install SBOM tools
        uses: taiki-e/install-action@f87f9990b09867202953bff9aa0c80e23ee16bb7 # v2.49.18
        with:
          tool: cargo-auditable,cargo-cyclonedx

      - name: Build release binary
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export PKG_CONFIG_PATH_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig
          elif [ "${{ matrix.target }}" = "armv7-unknown-linux-gnueabihf" ]; then
             export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc
             export PKG_CONFIG_PATH_armv7_unknown_linux_gnueabihf=/usr/lib/arm-linux-gnueabihf/pkgconfig
          fi
          cargo auditable build --release --locked --target ${{ matrix.target }}

      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json --target ${{ matrix.target }} --override-filename "sbom-${{ matrix.arch }}"

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/syslog_sniffer dist/syslog_sniffer_${{ needs.detect.outputs.version }}_linux_${{ matrix.arch }}
          cp sbom-${{ matrix.arch }}.json dist/

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: syslog_sniffer_${{ needs.detect.outputs.version }}_linux_${{ matrix.arch }}
          path: dist/*

  create-release:
    name: Create Draft Release
    needs: [detect, build-release-binaries, docker-build-and-test]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Download release binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: "syslog_sniffer_*"
          path: release_assets
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -lR release_assets/

      - name: Generate SHA256SUMS
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: 'release_assets/*'

      - name: Create Git tag
        run: |
          TAG="${{ needs.detect.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists on origin; skipping git tag creation."
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          name: Release ${{ needs.detect.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Publish Multi-Arch Docker Images
    needs: detect
    if: needs.detect.outputs.should_publish_docker == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: docker.io/hellqvio/syslog_sniffer
          tags: |
            type=raw,value=${{ needs.detect.outputs.version }}
            type=raw,value=latest

      - name: Check if Docker image already exists
        id: check-image
        run: |
          if docker buildx imagetools inspect "docker.io/hellqvio/syslog_sniffer:${{ needs.detect.outputs.version }}" >/dev/null 2>&1; then
            echo "Image already exists on Docker Hub; skipping build and push."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Image does not exist on Docker Hub; proceeding with build and push."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push multi-arch Docker image
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true