[package]
name = "syslog_sniffer"
version = "0.1.42"
edition = "2021"
license = "MIT"
description = "Fast, lightweight network packet sniffer for UDP syslog traffic with JSON summary reports"
repository = "https://github.com/hellqvio86/rust_syslog_sniffer"
readme = "README.md"
keywords = ["syslog", "sniffer", "pcap", "monitoring", "network"]
categories = ["network-programming", "command-line-utilities"]
rust-version = "1.88"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
env_logger = "0.11"
log = "0.4"
pcap = "2.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
proptest = "1.11.0"
